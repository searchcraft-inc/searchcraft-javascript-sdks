name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - main

permissions:
  contents: read

# A new push to a pull request cancels its earlier run. Runs for pushes to
# development and main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, build, type-check and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      # The React and Vue type-checks and tests import the built
      # javascript-sdk, so build before them.
      - name: Build packages
        run: yarn build

      - name: Type-check
        run: yarn type-check

      - name: Test
        run: yarn test:all
